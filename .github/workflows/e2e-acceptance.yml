name: E2E User Workflows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: User workflow scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MoonBit
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Show MoonBit version
        shell: bash
        run: moon --version

      - name: Update package registry
        shell: bash
        run: moon update

      - name: Build native CLI executable
        shell: bash
        run: moon build cmd/main --target native

      # All 8 user workflow scenarios live in scripts/e2e-acceptance.sh
      # so they can be run both locally and in CI from a single source.
      - name: Run E2E user workflow script
        shell: bash
        run: ./scripts/e2e-acceptance.sh
