name: E2E Acceptance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: Judge acceptance scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MoonBit
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Show MoonBit version
        shell: bash
        run: moon --version

      - name: Update package registry
        shell: bash
        run: moon update

      - name: Build native CLI executable
        shell: bash
        run: moon build cmd/main --target native

      # ── Scenario 1: Format conversion matrix ──
      - name: Scenario 1 - SRT to WebVTT
        shell: bash
        run: |
          _build/native/debug/build/cmd/main/main.exe subtitle convert examples/good.srt --to webvtt > /tmp/srt2vtt.vtt
          grep -q '^WEBVTT$' /tmp/srt2vtt.vtt
          grep -q 'Hello, welcome to MoonBit.' /tmp/srt2vtt.vtt

      - name: Scenario 1 - SRT to ASS
        shell: bash
        run: |
          _build/native/debug/build/cmd/main/main.exe subtitle convert examples/good.srt --to ass > /tmp/srt2ass.ass
          grep -q '^\[Script Info\]$' /tmp/srt2ass.ass
          grep -q '^\[Events\]$' /tmp/srt2ass.ass
          grep -q 'Dialogue: 0,0:00:01.00,0:00:03.20,Default' /tmp/srt2ass.ass

      - name: Scenario 1 - ASS to SRT
        shell: bash
        run: |
          _build/native/debug/build/cmd/main/main.exe subtitle convert examples/good.ass --to srt > /tmp/ass2srt.srt
          grep -q '00:00:01,000 --> 00:00:03,200' /tmp/ass2srt.srt
          grep -q 'Hello, welcome to MoonBit.' /tmp/ass2srt.srt

      - name: Scenario 1 - WebVTT to ASS
        shell: bash
        run: |
          _build/native/debug/build/cmd/main/main.exe subtitle convert examples/good.vtt --to ass > /tmp/vtt2ass.ass
          grep -q '^\[Script Info\]$' /tmp/vtt2ass.ass

      # ── Scenario 2: QC across all profiles ──
      - name: Scenario 2 - QC profiles detect issues
        shell: bash
        run: |
          EXE=_build/native/debug/build/cmd/main/main.exe
          for profile in default streaming cinema; do
            echo "Testing QC profile: $profile"
            $EXE qc examples/bad.srt --profile "$profile" > /tmp/qc-$profile.txt
            grep -q 'ERROR E101' /tmp/qc-$profile.txt || { echo "E101 missing for $profile"; exit 1; }
            grep -q 'ERROR E102' /tmp/qc-$profile.txt || { echo "E102 missing for $profile"; exit 1; }
          done

      - name: Scenario 2 - China platform delivery profiles
        shell: bash
        run: |
          EXE=_build/native/debug/build/cmd/main/main.exe
          for profile in ott-zh iqiyi youku tencent nrta; do
            echo "Testing delivery profile: $profile"
            $EXE delivery subtitle-check examples/bad.srt --profile "$profile" > /tmp/delivery-$profile.txt
            grep -q 'ERROR E101' /tmp/delivery-$profile.txt || { echo "E101 missing for $profile"; exit 1; }
          done

      # ── Scenario 3: Creator clean pipeline ──
      - name: Scenario 3 - Creator clean fixes AI artifacts
        shell: bash
        run: |
          _build/native/debug/build/cmd/main/main.exe creator clean examples/creator/ai-clean-bad.srt --verbose > /tmp/creator-clean.txt
          grep -q 'C601.*然后然后.*然后' /tmp/creator-clean.txt
          grep -q 'C601.*就是就是.*就是' /tmp/creator-clean.txt
          grep -q 'C602.*\[Music\]' /tmp/creator-clean.txt

      # ── Scenario 4: Delivery package acceptance ──
      - name: Scenario 4 - Good delivery package passes
        shell: bash
        run: |
          _build/native/debug/build/cmd/main/main.exe delivery check examples/delivery-package/good --profile distribution --subtitle-profile ott-zh > /tmp/pkg-good.txt
          grep -q '0 errors, 0 warnings' /tmp/pkg-good.txt || { echo "Good package should pass"; exit 1; }

      - name: Scenario 4 - Bad delivery package fails
        shell: bash
        run: |
          set +e
          _build/native/debug/build/cmd/main/main.exe delivery check examples/delivery-package/bad --profile distribution --subtitle-profile ott-zh --fail-on-error > /tmp/pkg-bad.txt
          status=$?
          set -e
          test "$status" -eq 1
          grep -q 'D101' /tmp/pkg-bad.txt

      # ── Scenario 5: Timecode toolchain ──
      - name: Scenario 5 - Timecode conversions
        shell: bash
        run: |
          EXE=_build/native/debug/build/cmd/main/main.exe
          $EXE timecode to-frames 01:00:00:00 --fps 25 > /tmp/tc1.txt
          grep -q '90000 frames' /tmp/tc1.txt
          $EXE timecode from-frames 90000 --fps 25 > /tmp/tc2.txt
          grep -q '01:00:00:00' /tmp/tc2.txt
          $EXE timecode convert 01:00:00:00 --from 23.976 --to 25 > /tmp/tc3.txt
          grep -q '01:00:03:15 @25fps' /tmp/tc3.txt
          $EXE timecode imf-from 01:00:00:00 --fps 25 > /tmp/tc4.txt
          grep -q 'editRate' /tmp/tc4.txt

      # ── Scenario 6: Bilingual merge and split roundtrip ──
      - name: Scenario 6 - Bilingual merge and split
        shell: bash
        run: |
          EXE=_build/native/debug/build/cmd/main/main.exe
          $EXE merge examples/good.srt examples/bilingual.srt --tolerance 800 > /tmp/merged.srt
          grep -q 'Hello, welcome to MoonBit.' /tmp/merged.srt
          $EXE split-bilingual examples/bilingual.srt --primary /tmp/primary.srt --secondary /tmp/secondary.srt
          grep -q 'MoonBit makes subtitle tooling compact.' /tmp/secondary.srt

      # ── Scenario 7: New QC rules (W205-W208, W311) ──
      - name: Scenario 7 - New QC whitespace and reading speed rules
        shell: bash
        run: |
          _build/native/debug/build/cmd/main/main.exe qc examples/acceptance/all-rules.srt --profile streaming --text-style bilingual > /tmp/new-rules.txt
          grep -q 'W205' /tmp/new-rules.txt || { echo "W205 (leading/trailing space) not triggered"; exit 1; }
          grep -q 'W310' /tmp/new-rules.txt || { echo "W310 (CPS) not triggered"; exit 1; }
          grep -q 'W208' /tmp/new-rules.txt || { echo "W208 (line imbalance) not triggered"; exit 1; }

      # ── Scenario 8: Explain all codes ──
      - name: Scenario 8 - Explain all diagnostic codes
        shell: bash
        run: |
          EXE=_build/native/debug/build/cmd/main/main.exe
          codes="E101 E102 E201 W201 W202 W203 W204 W205 W206 W207 W208 W310 W311 W401 W402 W501 W502 W503 W510 W511 W520 W601 W602 W603 W701 C401 C402 C403 C601 C602 C603 D101 D102 D202 D401 D402 D403 D404"
          for code in $codes; do
            output=$($EXE explain "$code")
            echo "$output" | grep -q 'Unknown' && { echo "Code $code returned Unknown!"; exit 1; } || true
          done
          echo "All 38 explain codes verified."
